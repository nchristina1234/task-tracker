
name: continuous-integration-and-deployment
run-name: ${{ github.actor }} triggered a CI build
on: [push]

jobs:
  backend-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpassword
          POSTGRES_DB: tasktracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser -d tasktracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taskuser:taskpassword@localhost:5432/tasktracker_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: python -m pytest
        working-directory: backend

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
